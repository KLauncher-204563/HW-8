<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Mercator (Web Mercator / EPSG:3857) — demo</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <style>
    html,body,#map { height:100%; margin:0; padding:0; }
    #info { position:absolute; left:10px; top:10px; z-index:1000;
           background:rgba(255,255,255,0.9); padding:8px; border-radius:6px;
           font-family:Arial, sans-serif; font-size:13px; }
  </style>
</head>
<body>
  <div id="info">Проекция: Web Mercator (EPSG:3857). Перетаскивай, приближай колёсиком.</div>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script>
    // Инициализация карты в Web Mercator (по умолчанию у Leaflet именно эта проекция)
    const map = L.map('map', {
      center: [20, 0],
      zoom: 2,
      worldCopyJump: true
    });

    // OpenStreetMap tiles (общедоступные) — в Mercator проекции
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    // Привязка по клику — показать координаты (географические) и проекцию в метрах (EPSG:3857)
    map.on('click', function(e) {
      const lat = e.latlng.lat.toFixed(6);
      const lon = e.latlng.lng.toFixed(6);

      // Перевод WGS84 -> Web Mercator (приближённая формула)
      function lonToX(lon) { return (lon * 20037508.34) / 180; }
      function latToY(lat) {
        const rad = lat * Math.PI / 180;
        return Math.log(Math.tan((Math.PI/4) + (rad/2))) * 20037508.34 / Math.PI;
      }
      const x = lonToX(lon).toFixed(2);
      const y = latToY(lat).toFixed(2);

      L.popup()
       .setLatLng(e.latlng)
       .setContent(
         `<b>lat/lon:</b> ${lat}, ${lon}<br/>
          <b>EPSG:3857 (метры):</b> X=${x}, Y=${y}`
       ).openOn(map);
    });
  </script>
<script type="module" src="./js/skript.js"></script>
</body>
</html>
